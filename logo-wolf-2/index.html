body{margin:0}
.lw{--page:#EEF1F5;--card:#FFFFFF;--ink:#172238;--soft:#4B5670;--line:#DDE2EA;background:var(--page);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;font-size:17px;line-height:1.55;min-height:100vh}
.lw.alt{--page:#0F1522;--card:#172036;--ink:#EEF2F8;--soft:#AAB4C8;--line:#2A3550}
.lw a{color:var(--ink)}
.lw :focus-visible{outline:3px solid #F2B230;outline-offset:3px}
.s-hell{--d:#172238;--m:#3A4866;--t:#55658A;--l:#E1E7F0;--a:#F2B230;--n:#172238;--mo:#F2B230;--s:#172238;--bg:#F6F7F9;background:var(--bg)}

.lw-wrap{max-width:1320px;margin:0 auto;padding:40px 32px 80px;box-sizing:border-box}
.lw-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 40px;flex-wrap:wrap;margin-bottom:28px}
.lw-h1{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:52px;line-height:1.02;letter-spacing:-.03em}
.lw-lead{margin:12px 0 0;max-width:44em;color:var(--soft);font-size:19px}
.lw-links{display:flex;gap:20px;font-weight:600}
.lw-group{margin:44px 0 18px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em}
.lw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(600px,100%),1fr));gap:24px}
.lw-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.lw-card h2{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.lw-card h2 span{color:var(--soft);font-weight:600;margin-right:8px}
.lw-card p{margin:4px 0 0;color:var(--soft);font-size:16px}
.lw-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lw-tile{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line)}
.lw-tile svg{width:76%;height:76%}
.lw-strip{display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-radius:12px;padding:14px 18px;border:1px solid var(--line)}
.lw-strip .mk64{width:64px;height:64px}
.lw-strip .mk32{width:32px;height:32px}
.lw-strip .mk16{width:16px;height:16px}
.lw-lockup{display:flex;align-items:center;gap:10px;margin-left:auto}
.lw-lockup svg{width:44px;height:44px}
.lw-lockup b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--d)}
@media (max-width:700px){
.lw-wrap{padding:28px 16px 64px}
.lw-h1{font-size:36px}
.lw-lockup{margin-left:0}
}
</style>
</head>

<h1 class="lw-h1">Der Wolf, Runde 2</h1>
<p class="lw-lead">Zwanzig Richtungen, ruhig und kräftig. Die Augen stehen waagerecht, das Maul bleibt geschlossen, die Ohren stehen aufrecht: aufmerksam, freundlich und klar. Jede Variante hell, dunkel und auf Wolfsgelb, darunter in 64, 32 und 16 Pixeln und neben dem Schriftzug.</p>
